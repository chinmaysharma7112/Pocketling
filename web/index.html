<!DOCTYPE html>
<html lang="en" class="gate-page look-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1830">
  <title>Pnevy</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var look = "dark";
      try {
        if (localStorage.getItem("pocketling.look") === "light") look = "light";
      } catch (e) {}
      document.documentElement.classList.remove("look-dark", "look-light");
      document.documentElement.classList.add(look === "light" ? "look-light" : "look-dark");
      var theme = document.querySelector('meta[name="theme-color"]');
      if (theme) theme.setAttribute("content", look === "light" ? "#8ec8ef" : "#0c1830");
      if (window.PocketlingAndroid) document.documentElement.classList.add("on-device");
    })();
  </script>
</head>
<body>
  <main class="gate">
    <header class="gate-title">
      <div>
        <h1>Pnevy</h1>
        <p>Your tiny friend</p>
      </div>
      <button type="button" class="look-switch" id="look-toggle" aria-pressed="true" aria-label="Dark mode">
        <svg class="look-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.6 5.6l1.5 1.5M16.9 16.9l1.5 1.5M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <svg class="look-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14.6 3.4a7.2 7.2 0 1 0 6.2 10.8A6.3 6.3 0 0 1 14.6 3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M17.1 5.5l.35.95.95.28-.95.35-.35.95-.35-.95-.95-.35.95-.28zM19.4 8.7l.22.55.55.16-.55.22-.22.55-.16-.55-.55-.22.55-.16z" fill="currentColor"/>
        </svg>
      </button>
    </header>
    <div class="stage-fairy" id="fairy-stage" hidden>
      <canvas id="preview-fairy"></canvas>
    </div>
    <div class="picker" id="picker" aria-label="Choose a fairy"></div>
    <button type="button" class="power" id="power" aria-pressed="false">
      <span>Fairy on my phone</span>
      <b id="power-state">Off</b>
    </button>
  </main>
  <div class="permit" id="sheet" hidden>
    <div>
      <p>The fairy flies over your screen. It never blocks your touches and never uses the internet.</p>
      <button type="button" class="power on" id="sheet-go">Continue</button>
    </div>
  </div>
  <script src="fairyMotion.js"></script>
  <script src="home.js"></script>
</body>
</html>
